services:
  cv_custom_otbi_reports_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cv_custom_otbi_reports_db
    restart: on-failure #unless-stopped
    ports:
      - '1437:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - cv_custom_otbi_reports_db_data:/var/opt/mssql

volumes:
  cv_custom_otbi_reports_db_data:
